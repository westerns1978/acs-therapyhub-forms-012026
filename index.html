<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *;">
    <title>ACS TherapyHub</title>
    <!-- Blessed static copy of BRAND.DEFAULT — a <meta> cannot read the JS object
         below. Keep in step with it (and with manifest.json theme_color). -->
    <meta name="theme-color" content="#C62828" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TherapyHub">
    <meta name="description" content="Assessment & Counseling Solutions - Client Portal & Clinical Platform">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/branding/acs-logomark.svg">
    <script>
      // NO service worker (2026-07-28). The old registration pointed at a /sw.js
      // that the SPA rewrite served as HTML, leaving clients that had ever
      // registered the earlier cache-everything worker unable to update it —
      // the stale-shell-after-deploy landmine. public/sw.js is now a kill switch
      // (browsers with a registered worker fetch it on their own update check);
      // this block actively unregisters as belt-and-braces. Caching is the
      // hosting layer's job: index.html no-cache, hashed /assets immutable.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => regs.forEach((r) => r.unregister()))
            .catch(() => {});
        });
      }
    </script>
    <!-- Tailwind is compiled at BUILD time (2026-08-07). The Play CDN runtime
         compiler that used to load here — <script src="cdn.tailwindcss.com"> —
         was a render-blocking third-party request that recompiled the whole
         design system in the browser on every page load, and left the app
         completely unstyled if it was unreachable. The config moved verbatim to
         /tailwind.config.js; the directives live in /styles/tailwind.css,
         imported from index.tsx. Do not reintroduce the CDN tag: check:privacy
         and check:brand both assert against it. -->
    <script>
      /* ══════════════════════════════════════════════════════════════════════
       * LAYER 1 — BRAND.  ***ATTESTA OVERRIDES THIS BLOCK.***
       *
       * The tenant's identity colour and nothing else. ACS is maroon; the Attesta
       * fork swaps this wholesale for its green and is DONE — it must not need to
       * touch the status ramps below, because status meaning is not tenant-specific.
       * The focus-visible ring in /index.css is brand too and swaps with it.
       * ══════════════════════════════════════════════════════════════════════ */
      /* THE RED BUDGET (rewritten 2026-08-02) — two reds, one job each:
       *   BRAND  — #C62828, the ACS mark red. Buttons, active nav, links, focus
       *            ring, AND the logomark: they are the SAME red on purpose.
       *            What Attesta overrides.
       *   DANGER — the BRICK ramp in the STATUS block (#A63A22): violations and
       *            critical ONLY.
       *
       * WHY THIS REPLACED THE 2026-07-28 VERSION. That block asserted the logo
       * vermillion "lives in the logo ASSET only, never a UI color" and set BRAND
       * to a cooler, darker burgundy (#7A222E) derived from that rule. The premise
       * was false when written: stlacs.com uses #C62828 as its primary UI color
       * today — CTA buttons, the phone button, the nav treatment. The client
       * already treats the mark red as a UI red. The website is the brand
       * authority; the red budget was an internal design opinion that contradicted
       * it, so the budget lost. Our own /branding/acs-logomark.svg carries
       * fill="#C62828" and was always correct — the UI tokens had drifted off it.
       *
       * SEPARATION IS BY ROLE, NOT BY HUE DISTANCE. Enforced in component code:
       * BRAND never renders as a status rule/dot/badge; DANGER never renders on a
       * button or nav item. Do not "fix" a perceived clash by re-tinting either
       * one — check the call site's role instead.
       *
       * RESIDUAL RISK, STATED NOT HIDDEN: BRAND #C62828 sits ~11° of hue from
       * DANGER #A63A22 — the same gap the old comment flagged as confusable. That
       * flag described a pair at near-equal LIGHTNESS AND CHROMA; this pair differs
       * strongly in both (brand is markedly brighter and more saturated), so it is
       * a different failure mode than the one that produced "a violation looked
       * like branding". The risk is not zero and is accepted deliberately.
       *
       * CONTRAST: white on #C62828 is 5.6:1 — AA at every text size, not AAA.
       * AAA on button fills was never a requirement here, and ACS ships exactly
       * this contrast on their own site.
       *
       * ┌─ BLESSED STATIC COPIES ────────────────────────────────────────────────
       * │ These CANNOT read --brand (a <meta>, a JSON file, a jsPDF RGB triple, a
       * │ URL query param, a CSS var fallback). Each is tagged BRAND-STATIC-COPY.
       * │
       * │   grep -rn "BRAND-STATIC-COPY" --exclude-dir=node_modules --exclude-dir=dist
       * │
       * │ ONE grep finds every one regardless of notation — which matters, because
       * │ two sites survived the last two brand migrations purely because they were
       * │ written as rgba() decimals and a hex grep could not see them.
       * │
       * │   index.html          <meta name="theme-color">        #RRGGBB
       * │   manifest.json       theme_color (+ _comment_ sibling) #RRGGBB
       * │   public/index.css    var() fallbacks x3               #RRGGBB
       * │   pages/WebsitePortalBridge.tsx  var() fallbacks x2     #RRGGBB
       * │   services/pdfDocuments.ts  MAROON                      [r, g, b]
       * │   tailwind.config.js  BRAND object                     #RRGGBB
       * │
       * │ RETIRED 2026-08-07: components/ui/GlobalHeader.tsx carried a sixth copy
       * │ as a ui-avatars.com URL param. That <img> is gone — it put the signed-in
       * │ staff member's NAME on a third-party host every render — so the brand
       * │ copy went with it. check:brand now asserts the URL stays absent.
       * │
       * │ ADDED 2026-08-07: tailwind.config.js. Tailwind moved from the Play CDN
       * │ runtime compiler to a build-time dependency, and a build-time config
       * │ cannot read the JS object below, so BRAND is declared in both files.
       * │ check:brand asserts the two agree.
       * │
       * │ ENFORCED: `npm run check:brand` parses BRAND.DEFAULT from this block and
       * │ asserts every site above matches it in its own notation. It runs in the
       * │ deploy chain, so a half-finished brand change cannot ship.
       * └────────────────────────────────────────────────────────────────────────
       */
      const BRAND = {
        DEFAULT: '#C62828',   // the ACS mark red — matches acs-logomark.svg + stlacs.com
        focus:   '#B71C1C',   // pressed / hover-darken
        content: '#FFFFFF',   // text on brand (5.6:1 on DEFAULT — AA)
        dark:    '#E57373',   // legible on the warm-charcoal dark surfaces (4.7:1 on raised #2C2B29)
        darkFocus: '#EF5350',
      };
      // Single source for CSS too (the /index.css focus ring reads these vars) —
      // no brand hex may live outside this block.
      document.documentElement.style.setProperty('--brand', BRAND.DEFAULT);
      document.documentElement.style.setProperty('--brand-focus', BRAND.focus);
      document.documentElement.style.setProperty('--brand-dark', BRAND.dark);

      /* ══════════════════════════════════════════════════════════════════════
       * LAYER 2 — STATUS.  ***ATTESTA INHERITS THIS UNCHANGED.***
       *
       * Warm, desaturated, deliberately BRAND-INDEPENDENT: these must read
       * correctly under maroon chrome AND under Attesta green, so they are never
       * tinted toward the brand hue. Character target: institutional warm paper —
       * closer to a legal document than a SaaS dashboard.
       *
       * Ink slots are contrast-verified on the K1 surfaces (card #FFFFFF,
       * page #F5F3EF; dark card #232221, dark raised #2C2B29 — the Card
       * component's dark surface, so dark inks must clear AA on BOTH):
       *   danger  600 #A63A22 brick   6.5 card / 5.8 page   (AA)
       *   warning 600 #955B06 ochre   5.6 card / 5.0 page   (AA)
       *   success 600 #4D6A52 sage    6.0 card / 5.4 page   (AA)
       *   neutral 500 #635C57 stone   6.6 card / 5.9 page   (AA)
       * Dark inks are the -400 slots (4.6-6.8 on raised #2C2B29, the binding
       * surface). Fill/border slots (50-300) are non-text and clear 3:1
       * against their own ink.
       *
       * NOTE ON BLUE: deliberately ABSENT. Blue was doing almost entirely
       * NON-status work in this app (Zoom/telehealth affordances, the calendar
       * "today" highlight, AI-provenance panels, file-type chips, avatar hues,
       * read receipts), so pinning it here meant any status re-tone silently
       * wrecked all of that. It is now unpinned and falls back to Tailwind's
       * default blue, free to keep doing non-status work. The status system has
       * no "info" hue: actionable states take BRAND, passive states take NEUTRAL.
       * ══════════════════════════════════════════════════════════════════════ */
      // DANGER — warmed one step past the old brick (600 #9A3324 → #A63A22).
      // NOTE (2026-08-02): the "~20° of hue from BRAND" this comment used to claim
      // described the retired burgundy #7A222E. Against the current BRAND #C62828
      // the gap is ~11° of hue; separation now rests on lightness + chroma and on
      // ROLE enforcement in component code, not on hue distance. See the RED BUDGET
      // block above — do not re-tint either red to widen the gap.
      // Still clearly redder + darker than the HIGH-tier terracotta (#9C5A2B).
      // 400 lightened for K1 (#CB7A5F measured 4.37:1 on the raised dark card #2C2B29).
      /* ── STATUS RAMPS + TAILWIND CONFIG MOVED OUT (2026-08-07) ──────────────
       * The BRICK / OCHRE / SAGE / STONE / TERRA ladders and the whole
       * `tailwind.config = { … }` object that used to sit here now live in
       * /tailwind.config.js, ported VERBATIM. They had to move because Tailwind
       * is no longer compiled in the browser: the Play CDN runtime compiler was
       * replaced by a build-time dependency, and a build-time config cannot be
       * declared in a <script> tag.
       *
       * The design rationale for those ramps — the measured AA contrast ratios,
       * the K1 chroma budget, the deliberate absence of a blue/info status tier,
       * the K5 grid-line floors — moved with them and is preserved in comments
       * there. Read /tailwind.config.js before re-toning anything.
       *
       * WHAT STAYS HERE, and why:
       *   · the BRAND object + the three setProperty calls above — those are CSS
       *     custom properties consumed by public/index.css at runtime, not
       *     Tailwind config. BRAND is now a BRAND-STATIC-COPY in TWO files and
       *     scripts/brandConsistencyCheck.mjs asserts both agree.
       *   · the <style> block below declaring --th-slate-400/500 and
       *     --th-on-surface*, which tailwind.config.js references by var().
       * ────────────────────────────────────────────────────────────────────── */
    </script>
    <style>
      /* Theme variables backing the on-surface tokens above (DEFERRED #24, 2026-07-28).
         Light values match surface.content / surface.secondary; dark values match
         dark.surface.content / dark.surface.secondary. Kept here — index.html is the
         single theme file — so the Attesta fork ports this as one hunk. */
      :root {
        --th-on-surface: #292524;
        --th-on-surface-secondary: #5D5852;
        /* K1 split-ramp text slots (RGB triplets — consumed via
           rgb(var() / <alpha-value>) in the slate config above, so opacity
           modifiers keep working). Light = the contrast-raised meta grays. */
        --th-slate-400: 110 104 98;   /* #6E6862 */
        --th-slate-500: 93 88 82;     /* #5D5852 */
      }
      .dark {
        --th-on-surface: #EDEBE8;
        --th-on-surface-secondary: #A8A4A0;
        /* Dark = near-neutral warm gray, decoupled from the warm surfaces. */
        --th-slate-400: 168 164 160;  /* #A8A4A0 */
        --th-slate-500: 155 151 146;  /* #9B9792 */
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background text-surface-content dark:bg-dark-background dark:text-dark-surface-content transition-colors duration-500 ease-in-out text-base leading-normal font-sans antialiased selection:bg-primary/20">
    <div id="root"></div>
    <script type="module" crossorigin src="/index.tsx"></script>
  </body>
</html>
